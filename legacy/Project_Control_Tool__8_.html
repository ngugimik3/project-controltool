<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Project Control Tool</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --tp: #0b0b0b;
        --ts: #52514e;
        --tm: #6b6963;
        --s0: #f5f4f0;
        --s1: #ebebe3;
        --s2: #fff;
        --bd: rgba(11, 11, 11, 0.1);
        --bds: rgba(11, 11, 11, 0.22);
        --r: 8px;
        --ac: #185fa5;
        --gs: #eaf3de;
        --gt: #3b6d11;
        --rs: #fcebeb;
        --rt: #a32d2d;
        --as: #faeeda;
        --at: #854f0b;
        --oa: #fff;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --tp: #fff;
          --ts: #c3c2b7;
          --tm: #a09f97;
          --s0: #111110;
          --s1: #1a1a19;
          --s2: #242422;
          --bd: rgba(255, 255, 255, 0.1);
          --bds: rgba(255, 255, 255, 0.22);
          --gs: #173404;
          --gt: #c0dd97;
          --rs: #501313;
          --rt: #f09595;
          --as: #412402;
          --at: #fac775;
          --ac: #3987e5;
        }
      }
      :root[data-theme="dark"] {
        --tp: #fff;
        --ts: #c3c2b7;
        --tm: #a09f97;
        --s0: #111110;
        --s1: #1a1a19;
        --s2: #242422;
        --bd: rgba(255, 255, 255, 0.1);
        --bds: rgba(255, 255, 255, 0.22);
        --gs: #173404;
        --gt: #c0dd97;
        --rs: #501313;
        --rt: #f09595;
        --as: #412402;
        --at: #fac775;
        --ac: #3987e5;
      }
      body {
        background: var(--s0);
        color: var(--tp);
        font:
          14px/1.45 system-ui,
          -apple-system,
          sans-serif;
        padding: 1.25rem;
        min-height: 100vh;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
      }
      .hide {
        display: none !important;
      }
      input,
      select,
      textarea {
        background: var(--s2);
        border: 0.5px solid var(--bds);
        border-radius: var(--r);
        padding: 7px 10px;
        font:
          13px system-ui,
          sans-serif;
        color: var(--tp);
        width: 100%;
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 1px;
      }
      textarea {
        resize: vertical;
        min-height: 56px;
      }
      label.fl {
        display: block;
        font-size: 12px;
        color: var(--ts);
        margin: 8px 0 3px;
      }
      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 10px;
        padding-bottom: 0.875rem;
        border-bottom: 0.5px solid var(--bd);
        margin-bottom: 1rem;
      }
      .hdr-title {
        font-size: 17px;
        font-weight: 500;
      }
      .hdr-meta,
      .sub {
        font-size: 11px;
        color: var(--tm);
      }
      .hr {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }
      .hr select {
        width: 200px;
      }
      .user-badge {
        font-size: 12px;
        padding: 5px 11px;
        border-radius: 20px;
        border: 0.5px solid var(--bds);
        background: var(--s1);
        cursor: pointer;
      }
      .tabs {
        display: flex;
        gap: 1px;
        border-bottom: 0.5px solid var(--bd);
        margin-bottom: 1rem;
        overflow-x: auto;
      }
      .tab {
        padding: 7px 11px;
        font-size: 12px;
        color: var(--ts);
        cursor: pointer;
        border: none;
        background: none;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .tab.active {
        color: var(--ac);
        border-bottom-color: var(--ac);
        font-weight: 500;
      }
      .rail {
        display: flex;
        border: 0.5px solid var(--bd);
        border-radius: var(--r);
        overflow: hidden;
        margin-bottom: 0.6rem;
        background: var(--s2);
      }
      .rail span {
        flex: 1;
        padding: 6px 8px;
        font-size: 11px;
        color: var(--tm);
        border-right: 0.5px solid var(--bd);
        text-align: center;
      }
      .rail span:last-child {
        border: 0;
      }
      .rail .done {
        background: var(--s1);
        color: var(--ts);
      }
      .rail .cur {
        background: var(--as);
        color: var(--at);
        font-weight: 600;
      }
      .grow {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 0.8rem;
        flex-wrap: wrap;
      }
      .err {
        background: var(--rs);
        color: var(--rt);
        border-radius: var(--r);
        padding: 0.5rem 0.8rem 0.5rem 1.6rem;
        font-size: 12px;
        margin-bottom: 0.8rem;
      }
      .err li {
        margin-left: 0.4rem;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 9px;
        margin-bottom: 1rem;
      }
      .kpi {
        background: var(--s1);
        border-radius: var(--r);
        padding: 0.8rem;
      }
      .kl {
        font-size: 11px;
        color: var(--tm);
        margin-bottom: 4px;
      }
      .kv {
        font-size: 21px;
        font-weight: 500;
      }
      .ks {
        font-size: 11px;
        color: var(--ts);
      }
      .card {
        background: var(--s1);
        border-radius: var(--r);
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .ct {
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
      }
      .badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 500;
        padding: 2px 7px;
        border-radius: 4px;
      }
      .bg {
        background: var(--gs);
        color: var(--gt);
      }
      .br {
        background: var(--rs);
        color: var(--rt);
      }
      .ba {
        background: var(--as);
        color: var(--at);
      }
      .bn {
        background: var(--s2);
        color: var(--tm);
        border: 0.5px solid var(--bd);
      }
      .btn {
        border: none;
        border-radius: var(--r);
        padding: 7px 14px;
        font:
          13px system-ui,
          sans-serif;
        cursor: pointer;
      }
      .btp {
        background: var(--ac);
        color: var(--oa);
      }
      .btg {
        background: none;
        border: 0.5px solid var(--bds);
        color: var(--ts);
      }
      .bts {
        background: none;
        border: 0.5px solid var(--bd);
        color: var(--ac);
        padding: 4px 9px;
        font-size: 11px;
      }
      .btd {
        background: none;
        border: 0.5px solid var(--rt);
        color: var(--rt);
        padding: 4px 9px;
        font-size: 11px;
      }
      .ok {
        background: var(--gt);
        color: var(--s2);
      }
      .bad {
        background: var(--rt);
        color: var(--s2);
      }
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        background: var(--s2);
        border-radius: var(--r);
        overflow: hidden;
      }
      .tbl th {
        background: var(--s1);
        color: var(--ts);
        font-weight: 500;
        text-align: left;
        padding: 6px 9px;
      }
      .tbl td {
        padding: 6px 9px;
        border-bottom: 0.5px solid var(--bd);
        vertical-align: middle;
      }
      .tbl input,
      .tbl select {
        padding: 4px 7px;
        font-size: 12px;
      }
      .n {
        text-align: right;
      }
      .warn {
        color: var(--rt);
        font-size: 12px;
      }
      .f {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 9px;
        margin-bottom: 0.6rem;
      }
      .gt {
        position: relative;
        min-width: 120px;
      }
      .gt i {
        position: absolute;
        top: 30%;
        height: 40%;
        border-radius: 2px;
        background: var(--ac);
      }
      .gt i.s2 {
        background: var(--rt);
      }
      .gt i.s3 {
        background: var(--gt);
      }
      .gt i.s0 {
        background: var(--tm);
      }
      .irow {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 7px 0;
        border-bottom: 0.5px solid var(--bd);
        flex-wrap: wrap;
      }
      .irow .b {
        flex: 1;
        min-width: 200px;
      }
      .empty {
        text-align: center;
        padding: 2rem;
        color: var(--tm);
      }
      .toast {
        position: fixed;
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        right: 22px;
        background: var(--s2);
        border: 0.5px solid var(--bds);
        padding: 9px 16px;
        border-radius: var(--r);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
      }
      #login {
        position: fixed;
        inset: 0;
        background: var(--s0);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 9;
      }
      .lc {
        background: var(--s2);
        border: 0.5px solid var(--bd);
        border-radius: var(--r);
        padding: 1.6rem;
        width: min(360px, 92vw);
      }
      .lc h2 {
        font-size: 16px;
        font-weight: 500;
      }
      body[data-role="user"] .a,
      body[data-role="user"] .s,
      body[data-role="admin"] .s {
        display: none !important;
      }
      .sc {
        overflow-x: auto;
      }
      @media (max-width: 620px) {
        .kv {
          font-size: 18px;
        }
      }
      .ph {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .at {
        width: 120px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }
      .at img {
        width: 120px;
        height: 90px;
        object-fit: cover;
        border-radius: var(--r);
        cursor: pointer;
      }
      .at small {
        font-size: 11px;
        color: var(--tm);
        word-break: break-all;
      }
      .na {
        background: var(--tm);
        color: var(--s2);
      }
      .gh {
        position: relative;
        height: 14px;
        font-size: 10px;
        font-weight: 400;
        color: var(--tm);
      }
      .gh span {
        position: absolute;
        top: 0;
        white-space: nowrap;
      }
      #pr {
        display: none;
      }
      @media print {
        body > *:not(#pr) {
          display: none !important;
        }
        #pr:not(:empty) {
          display: block !important;
          color: #000;
          background: #fff;
          font:
            12px system-ui,
            sans-serif;
        }
        body {
          background: #fff;
          padding: 0;
        }
        #pr .tbl {
          background: #fff;
          color: #000;
        }
        #pr .tbl th {
          background: #eee;
          color: #000;
        }
        #pr .tbl td {
          border-color: #999;
        }
        #pr img {
          max-width: 46%;
          margin: 4px;
        }
      }
    </style>
  </head>
  <body>
    <div id="login">
      <div class="lc">
        <h2>Project control tool</h2>
        <p class="sub">Sign in to continue</p>
        <div id="lerr" class="err hide"></div>
        <label class="fl">Username</label
        ><input id="lu" autocomplete="username" /><label class="fl"
          >Password</label
        ><input
          id="lp"
          type="password"
          autocomplete="current-password"
          onkeydown="if (event.key === 'Enter') login();"
        />
        <button
          class="btn btp"
          style="width: 100%; margin-top: 0.9rem"
          onclick="login()"
        >
          Log in
        </button>
        <p class="sub" id="lh" style="margin-top: 0.8rem"></p>
      </div>
    </div>
    <div class="wrap hide" id="app">
      <div class="hdr">
        <div>
          <div class="hdr-title">Project control tool</div>
          <div class="hdr-meta" id="meta"></div>
        </div>
        <div class="hr">
          <select
            id="sel"
            aria-label="Project"
            onchange="pick(this.value)"
          ></select>
          <div
            class="user-badge"
            id="ub"
            onclick="logout()"
            title="Click to log out"
          ></div>
        </div>
      </div>
      <div id="gate"></div>
      <div class="tabs" id="tabs"></div>
      <div id="view"></div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script>
      const $ = (id) => document.getElementById(id),
        v = (id) => $(id).value.trim();
      const ST = [
        "Inception",
        "Site Survey",
        "Procurement",
        "Workshop & FAT",
        "Installation",
        "Commissioning",
        "SAT",
        "Training",
        "Handover",
        "Closed",
      ];
      const TABS = [
        "dashboard",
        "projects",
        "survey",
        "schedule",
        "procurement",
        "fat",
        "install",
        "commis",
        "sat",
        "training",
        "support",
        "handover",
        "costing",
        "admin",
      ];
      const TL = {
        dashboard: "Dashboard",
        projects: "Projects",
        schedule: "Schedule",
        procurement: "Procurement",
        survey: "Site Survey",
        fat: "FAT",
        install: "Installation",
        commis: "Commissioning",
        sat: "SAT",
        training: "Training",
        support: "Support",
        handover: "Handover",
        costing: "Costing",
        admin: "Admin",
      };
      const TS = ["Not started", "In progress", "Blocked", "Done"],
        POS = [
          "Draft",
          "Approved",
          "Sent",
          "Confirmed",
          "In production",
          "Shipped",
          "In transit",
          "Received",
          "Inspected",
        ];
      const TYPES = ["Control panel", "Pump station", "Fountain system"];
      const WBS = [
        ["Approve technical spec", "Design Engineer", 0, 5, null],
        ["Issue purchase orders", "Procurement Officer", 2, 10, null],
        ["Workshop assembly", "Workshop Lead", 12, 15, 1],
        ["Factory acceptance test", "Quality Manager", 27, 3, 2],
        ["Site installation", "Site Manager", 30, 10, 3],
        ["Commissioning and SAT", "Commissioning Engineer", 40, 5, 4],
        ["Compile handover pack", "Project Manager", 45, 3, 5],
        ["Site survey and previsit", "Site Manager", 0, 5, null],
      ];
      const FAT = [
        "Visual and mechanical inspection",
        "Insulation resistance (MΩ)",
        "Earth continuity (Ω)",
        "I/O point check",
        "Protection tests",
        "Functional test",
      ];
      const SAT = [
        "Mechanical installation verified",
        "Power-up and wiring check",
        "Field I/O check",
        "Commissioning tests",
        "Performance readings",
        "Operator training",
      ];
      const DOCS = [
        "Supplier certificates",
        "FAT report",
        "SAT report",
        "As-built drawings",
        "O&M manuals",
        "Warranty terms",
      ];
      const TRN = [
        "Operator training",
        "Maintenance staff training",
        "Safety briefing",
        "O&M manual walkthrough",
        "Training attendance register signed",
      ];
      const TLS = [
        "Special tools supplied",
        "Calibration tools and certificates",
        "Lifting and rigging gear",
        "Spare keys and access cards",
      ];
      const SPR = [
        "Recommended spares list issued",
        "Consumables on site (fuses, filters, seals)",
        "Critical spares on site",
        "Spares labelled and stored",
      ];
      const WAR = [
        "Warranty terms issued to client",
        "Warranty start date recorded",
        "Service contacts and escalation list",
        "First service visit scheduled",
        "Remote support access agreed",
      ];
      const TEST = ["fat", "sat"],
        isOk = (c) =>
          SK.includes(c.kind)
            ? c.s === 3
            : c.res === "Pass" || (c.res === "NA" && !TEST.includes(c.kind)),
        CL = {
          fat: "FAT",
          sat: "SAT",
          training: "Training",
          tools: "Tools",
          parts: "Service parts",
          warranty: "Warranty support",
        };
      const mk = (p, k, a) =>
        a.forEach((it) =>
          p.checks.push({
            id: nid(p.checks),
            kind: k,
            item: it,
            reading: "",
            res: "",
            note: "",
            s: 0,
            revs: [],
          }),
        );
      const seedChecks = (p) =>
        [
          ["survey", SUR],
          ["fat", FAT],
          ["install", INS],
          ["commis", COM],
          ["sat", SAT],
          ["training", TRN],
          ["tools", TLS],
          ["parts", SPR],
          ["warranty", WAR],
        ].forEach(([k, a]) => mk(p, k, a));
      const migrate = (p) => {
        if (p.att) return;
        p.att = [];
        p.notes = {};
        if (p.stage >= 4) p.stage++;
        [
          ["training", TRN],
          ["tools", TLS],
          ["parts", SPR],
          ["warranty", WAR],
        ].forEach(([k, a]) => mk(p, k, a));
      };
      let P = [],
        U = [],
        L = [],
        cur = 0,
        tab = "dashboard",
        me = null,
        BL = [];
      const ld = (k, d) => {
        try {
          return JSON.parse(localStorage.getItem(k)) || d;
        } catch {
          return d;
        }
      };
      function save() {
        try {
          localStorage.setItem("pm:p", JSON.stringify(P));
          localStorage.setItem("pm:u", JSON.stringify(U));
          localStorage.setItem("pm:l", JSON.stringify(L));
          return 1;
        } catch {
          toast(
            "Could not save: browser storage is full. Remove some attachments.",
          );
          return 0;
        }
      }
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const iso = (d) =>
          `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`,
        today = () => iso(new Date());
      const add = (s, n) => {
        const d = new Date(s + "T00:00:00");
        d.setDate(d.getDate() + n);
        return iso(d);
      };
      const nid = (a) => (a.length ? Math.max(...a.map((x) => x.id)) + 1 : 1),
        fmt = (n) => Math.round(n).toLocaleString(),
        cp = () => P.find((p) => p.id === cur);
      const can = (...r) => me && r.includes(me.role),
        RL = { superadmin: "Super Admin", admin: "Admin", user: "User" };
      function toast(m, ms) {
        const t = $("toast");
        t.textContent = m;
        t.classList.add("show");
        clearTimeout(t._h);
        t._h = setTimeout(() => t.classList.remove("show"), ms || 3000);
      }
      function log(a) {
        L.push({
          ts: new Date().toISOString(),
          u: me ? me.username : "system",
          a,
        });
        if (L.length > 300) L = L.slice(-300);
      }
      async function hash(s) {
        return [
          ...new Uint8Array(
            await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)),
          ),
        ]
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }
      const rec = (o) => o.st >= 7,
        fin = (p) => {
          const bud = p.costs.reduce((a, c) => a + c.bud, 0),
            act = p.costs.reduce((a, c) => a + c.act, 0),
            com = p.pos.filter((o) => o.st > 0).reduce((a, o) => a + o.cost, 0);
          return { bud, act, com, fc: Math.max(bud, act, com) };
        };
      function alerts(p) {
        const a = [];
        p.tasks
          .filter((t) => t.st !== 3 && t.end < today())
          .forEach((t) => a.push(`Overdue: ${t.name}. Notify ${t.role}.`));
        p.pos
          .filter((o) => !rec(o) && o.prom > o.need)
          .forEach((o) =>
            a.push(
              `Slipping: ${o.item} from ${o.sup} is promised ${o.prom}, needed ${o.need}.`,
            ),
          );
        return a;
      }
      function blockers(p) {
        const b = [],
          s = p.stage,
          n = (k) => p.checks.filter((c) => c.kind === k && !isOk(c)).length;
        if (s === 0) {
          const x = p.spec;
          if (!x.dim || !x.volt || !x.kw)
            b.push(
              "Complete dimensions, voltage and power in the technical spec.",
            );
          const ap = p.tasks.find((t) =>
            t.name.toLowerCase().startsWith("approve"),
          );
          if (ap && ap.st !== 3) b.push(`Mark “${ap.name}” as Done.`);
        }
        if (s === 1) {
          if (!p.pos.length) b.push("No purchase orders raised.");
          const k = p.pos.filter((o) => !rec(o)).length;
          if (k) b.push(`${k} purchase order(s) not yet received.`);
        }
        if (s === 2 && n("fat")) b.push(`${n("fat")} FAT item(s) not passed.`);
        if (s === 3 && n("install"))
          b.push(`${n("install")} installation step(s) not done.`);
        if (s === 4 && n("commis"))
          b.push(`${n("commis")} commissioning step(s) not done.`);
        if (s === 5) {
          if (n("sat")) b.push(`${n("sat")} SAT item(s) not passed.`);
          if (!p.signed) b.push("Client SAT sign-off is missing.");
        }
        if (s === 6 && n("training"))
          b.push(`${n("training")} training item(s) not complete.`);

          X.write(wb, { bookType: "xlsx", type: "array" }),
        );
      }
      async function sv(name, data) {
        let d = null;
        try {
          d = window.claude ? await window.claude.use("downloads") : null;
        } catch (e) {}
        if (!d) {
          toast(
            "Direct downloads are not available in this view, so the backup option is opening instead.",
            7000,
          );
          return name.endsWith(".pdf") ? gPrint() : gTSV();
        }
        toast("File ready. Confirm the save prompt when it appears.", 7000);
        try {
          await d.save({ filename: name, data });
          toast("Saved.");
        } catch (e) {
          if (e && e.code === "declined") return toast("Save cancelled.");
          toast(
            "Could not save (" +
              ((e && (e.code || e.message)) || "unknown error") +
              "). Use Print view or Copy for Excel instead.",
            9000,
          );
        }
      }
      async function ex(k) {
        toast("Preparing the file...");
        try {
          await (k === 1 ? gPDF() : gXLS());
        } catch (e) {
          toast(
            "Export failed: " +
              ((e && (e.message || e.code)) || e) +
              ". Use Print view or Copy for Excel instead.",
            9000,
          );
        }
      }
      function gPrint() {
        const p = cp(),
          ts = gSorted(p),
          { a, b, u } = gwin(p),
          sp = b - a,
          rh = 26,
          Lw = 240,
          W = 900,
          tt = tks(a, b, u),
          H = ts.length * rh + 30,
          x = (m) => Lw + ((m - a) / sp) * (W - Lw - 10),
          cl = ["#777", "#185fa5", "#b3261e", "#2e7d4f"];
        let s = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${H}' width='100%' font-family='sans-serif' font-size='11'>`;
        tt.forEach((k) => {
          const gx = Lw + k.x * (W - Lw - 10);
          s += `<line x1='${gx}' x2='${gx}' y1='18' y2='${H}' stroke='#ccc'/><text x='${gx + 2}' y='12' font-size='9' fill='#555'>${k.l}</text>`;
        });
        ts.forEach((t, i) => {
          const y = 26 + i * rh,
            l = Math.max(DD(t.start), a),
            r = Math.min(DD(t.end) + 864e5, b);
          s +=
            `<text x='2' y='${y + 12}'>${esc(t.name.slice(0, 40))}</text>` +
            (r > l
              ? `<rect x='${x(l)}' y='${y + 3}' width='${Math.max(3, x(r) - x(l))}' height='14' fill='${cl[t.st]}'/>`
              : "");
        });
        s += "</svg>";
        $("pr").innerHTML =
          `<h2>Project schedule</h2><p>${esc(p.name)} · ${esc(p.client)} · ${esc(p.type)}<br>Stage: ${ST[p.stage]} · ${iso(new Date(a))} to ${iso(new Date(b - 864e5))} (${u}s) · Printed ${new Date().toLocaleDateString("en-GB")}</p>${s}<table class='tbl'><tr><th>Task</th><th>Role</th><th>Owner</th><th>Start</th><th>End</th><th>Status</th><th>Depends on</th></tr>${ts
            .map((t) => {
              const d = p.tasks.find((y) => y.id === t.dep);
              return `<tr><td>${esc(t.name)}</td><td>${esc(t.role)}</td><td>${esc(t.owner)}</td><td>${t.start}</td><td>${t.end}</td><td>${TS[t.st]}</td><td>${d ? esc(d.name) : "Parallel"}</td></tr>`;
            })
            .join("")}</table>`;
        toast(
          "Opening the print dialog. If nothing opens, press Ctrl+P and choose Save as PDF.",
          8000,
        );
        setTimeout(() => window.print(), 150);
      }
      function gTSV() {
        const p = cp(),
          ts = gSorted(p),
          { a, b, u } = gwin(p),
          pd = pds(a, b, u);
        if (pd.length > 400)
          return toast(
            "That period has too many columns. Use a coarser scale or a shorter range.",
          );
        const lab = (t) =>
            u === "month"
              ? new Date(t).toLocaleString("en-GB", {
                  month: "short",
                  year: "2-digit",
                })
              : iso(new Date(t)).slice(5),
          T = String.fromCharCode(9),
          N = String.fromCharCode(10),
          cl = (s) =>
            String(s ?? "")
              .split(T)
              .join(" ");
        const rows = [
          [
            "Task",
            "Role",
            "Owner",
            "Status",
            "Start",
            "End",
            "Depends on",
            ...pd.map((q) => lab(q[0])),
          ],
          ...ts.map((t) => {
            const d = p.tasks.find((y) => y.id === t.dep);
            return [
              t.name,
              t.role,
              t.owner,
              TS[t.st],
              t.start,
              t.end,
              d ? d.name : "Parallel",
              ...pd.map((q) =>
                DD(t.start) < q[1] && DD(t.end) + 864e5 > q[0] ? "X" : "",
              ),
            ];
          }),
        ];
        let box = $("fb");
        if (!box) {
          box = document.createElement("textarea");
          box.id = "fb";
          box.style.cssText =
            "width:100%;min-height:140px;margin-bottom:10px;font-family:monospace;font-size:11px";
          $("view").prepend(box);
        }
        box.value = rows.map((r) => r.map(cl).join(T)).join(N);
        box.select();
        try {
          document.execCommand("copy");
        } catch (e) {}
        toast(
          "The schedule is selected and copied. Paste it into Excel with Ctrl+V.",
          8000,
        );
      }
      {
        const f = V.schedule;
        V.schedule = (p) =>
          p
            ? `<div class='grow'><button class='btn btp' onclick='ex(1)'>Download PDF</button><button class='btn btg' onclick='ex(2)'>Download Excel</button><button class='btn btg' onclick='gPrint()'>Print view</button><button class='btn btg' onclick='gTSV()'>Copy for Excel</button><span class='sub'>Exports follow the period set below. Excel marks active periods with a block.</span></div>` +
              f(p)
            : f(p);
      }
      ["projects", "schedule", "procurement", "handover"].forEach((k) => {
        const f = V[k];
        V[k] = (p) => f(p) + (p ? attCard(p, k) : "");
      });
      let DB = null,
        AS = null,
        USR = null,
        canW = null,
        smeta = "",
        snap = {},
        saving = 0,
        pt = 0,
        dirty = 0,
        first = 1;
      const cj = (o) =>
        JSON.stringify(o, (k, v) =>
          v && typeof v === "object" && !Array.isArray(v)
            ? Object.keys(v)
                .sort()
                .reduce((a, x) => ((a[x] = v[x]), a), {})
            : v,
        );
      function save() {
        if (DB) {
          clearTimeout(pt);
          pt = setTimeout(flush, 500);
          return 1;
        }
        try {
          localStorage.setItem("pm:p", JSON.stringify(P));
          localStorage.setItem("pm:u", JSON.stringify(U));
          localStorage.setItem("pm:l", JSON.stringify(L));
          return 1;
        } catch (e) {
          toast(
            "Could not save: browser storage is full. Remove some attachments.",
          );
          return 0;
        }
      }
      async function flush() {
        if (saving) {
          pt = setTimeout(flush, 500);
          return;
        }
        saving = 1;
        try {
          for (const p of P) {
            const j = cj(p);
            if (snap[p.id] !== j) {
              await DB.doc("projects/p" + p.id).set(
                JSON.parse(JSON.stringify(p)),
              );
              snap[p.id] = j;
            }
          }
          for (const id of Object.keys(snap)) {
            if (!P.some((p) => String(p.id) === id)) {
              await DB.doc("projects/p" + id).delete();
              delete snap[id];
            }
          }
          const s = cj({ TY, RR });
          if (s !== smeta) {
            await DB.doc("meta/settings").set({ TY, RR });
            smeta = s;
          }
        } catch (e) {
          toast(
            e && e.code === "invalid_argument"
              ? "You have view-only access, so that change was not shared."
              : "Could not sync: " + ((e && (e.code || e.message)) || "error"),
            6000,
          );
        }
        saving = 0;
      }
      function log(a) {
        const e = {
          ts: new Date().toISOString(),
          u: me ? me.name : "system",
          a,
        };
        L.push(e);
        if (L.length > 300) L = L.slice(-300);
        if (DB)
          DB.collection("log")
            .doc(Date.now() + "-" + Math.random().toString(36).slice(2, 7))
            .set(e)
            .catch(() => {});
      }
      function redraw() {
        const a = document.activeElement;
        if (!dirty) return;
        if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) {
          setTimeout(redraw, 1500);
          return;
        }
        dirty = 0;
        if (!cp() && P.length) cur = P[0].id;
        draw();
      }
      function sub() {
        const bad = (e) =>
          toast(
            "Live sync stopped (" +
              ((e && e.code) || "error") +
              "). Reload the page.",
            8000,
          );
        DB.collection("projects").onSnapshot((s) => {
          const ids = new Set();
          let ch = first;
          first = 0;
          s.docs.forEach((d) => {
            const o = d.data();
            if (!o) return;
            ids.add(String(o.id));
            const j = cj(o),
              i = P.findIndex((p) => p.id === o.id);
            if (snap[o.id] === j) return;
            if (i > -1 && cj(P[i]) !== snap[o.id]) return;
            const m = JSON.parse(JSON.stringify(o));
            migrate(m);
            migrate2(m);
            migrate3(m);
            m.params = m.params || [];
            snap[o.id] = j;
            if (i > -1) P[i] = m;
            else P.push(m);
            ch = 1;
          });
          for (const id of Object.keys(snap)) {
            if (!ids.has(id)) {
              const i = P.findIndex((p) => String(p.id) === id);
              if (i > -1 && cj(P[i]) === snap[id]) {
                P.splice(i, 1);
                ch = 1;
              }
              delete snap[id];
            }
          }
          if (ch) {
            dirty = 1;
            setTimeout(redraw, 200);
          }
        }, bad);
        DB.doc("meta/settings").onSnapshot((d) => {
          if (!d.exists) return;
          const o = d.data();
          if (Array.isArray(o.TY)) TY = o.TY;
          if (Array.isArray(o.RR)) RR = o.RR;
          smeta = cj({ TY, RR });
          dirty = 1;
          setTimeout(redraw, 200);
        }, bad);
        DB.collection("log")
          .orderBy("ts", "desc")
          .limit(100)
          .onSnapshot((s) => {
            L = s.docs.map((d) => d.data()).reverse();
          }, bad);
      }
      async function boot() {
        const c = window.claude;
        if (!c) return;
        try {
          USR = await c.use("user");
          DB = await c.use("db");
          AS = await c.use("assets");
        } catch (e) {}
        if (!DB) {
          $("lh").textContent =
            "Shared mode is not available here, so data stays in this browser.";
          return;
        }
        let v = null,
          own = false,
          ed = false;
        try {
          v = USR ? await USR.me() : null;
          own = USR ? await USR.isOwner() : false;
          ed = USR ? await USR.canEdit() : false;
          canW = USR ? await USR.can("data.write") : null;
        } catch (e) {}
        me = {
          id: 1,
          name: (v && v.name) || "Team member",
          username: "viewer",
          role: own ? "superadmin" : ed ? "admin" : "user",
        };
        P = [];
        cur = 0;
        snap = {};
        enter();
        sub();
        if (canW === false)
          toast(
            "You have view-only access. Ask the owner for Contributor access to make changes.",
            9000,
          );
      }
      const d2b = (u) => {
        const [h, b] = u.split(","),
          s = atob(b),
          a = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
        return new Blob([a], { type: h.match(/:(.*?);/)[1] });
      };
      const shrinkB = (f) =>
        new Promise((r) => {
          const i = new Image();
          i.onload = () => {
            const k = Math.min(1, 1600 / Math.max(i.width, i.height)),
              c = document.createElement("canvas");
            c.width = i.width * k;
            c.height = i.height * k;
            c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
            c.toBlob((b) => r(b || f), "image/jpeg", 0.8);
          };
          i.onerror = () => r(f);
          i.src = URL.createObjectURL(f);
        });
      async function addAtt(el) {
        const p = cp(),
          st = el.dataset.s,
          n0 = p.att.length;
        for (const f of el.files) {
          const im = f.type.startsWith("image/");
          try {
            if (AS) {
              const b = im ? await shrinkB(f) : f,
                r = await AS.upload(b, { contentType: b.type || f.type });
              p.att.push({
                id: Date.now() + p.att.length,
                st,
                name: f.name,
                img: im,
                data: r.url,
                aid: r.id,
                by: me ? me.name : "",
              });
            } else {
              if (!im && f.size > 600000) {
                toast(`“${f.name}” is over 600 KB and was skipped.`);
                continue;
              }
              p.att.push({
                id: nid(p.att),
                st,
                name: f.name,
                img: im,
                data: await shrink(f),
              });
            }
          } catch (e) {
            toast(
              `Could not add “${f.name}” (${(e && e.code) || "error"}).`,
              6000,
            );
          }
        }
        el.value = "";
        log(`${p.name}: files added to ${st}`);
        if (!save()) p.att.length = n0;
        draw();
      }
      async function rmAtt(id) {
        if (!can("admin", "superadmin")) return;
        const p = cp(),
          a = p.att.find((x) => x.id === id);
        if (a && a.aid && AS) {
          try {
            await AS.delete(a.aid);
          } catch (e) {}
        }
        p.att = p.att.filter((x) => x.id !== id);
        save();
        draw();
      }
      function openAtt(id) {
        const a = cp().att.find((x) => x.id === id);
        if (!a) return;
        const u = a.data.startsWith("data:")
          ? URL.createObjectURL(d2b(a.data))
          : a.data;
        if (!window.open(u, "_blank"))
          toast(
            "Your browser blocked the preview. Allow pop-ups for this page.",
          );
      }
      function imp() {
        try {
          const d = JSON.parse($("bk").value);
          if (!Array.isArray(d)) throw 0;
          if (DB) {
            d.forEach((p, i) => {
              p.id = Date.now() + i;
              P.push(p);
            });
          } else {
            P = d;
          }
          cur = P.length ? P[0].id : 0;
          log("Imported backup");
          save();
          draw();
          toast("Backup imported.");
        } catch (e) {
          toast("That is not a valid backup.");
        }
      }
      async function impLoc() {
        let o = [];
        try {
          o = JSON.parse(localStorage.getItem("pm:p")) || [];
        } catch (e) {}
        if (!o.length) return toast("No projects are saved in this browser.");
        if (
          !confirm(
            `Copy ${o.length} project(s) saved in this browser into the shared data?`,
          )
        )
          return;
        toast("Importing...");
        let n = 0;
        for (const p of o) {
          for (const a of p.att || []) {
            if (AS && a.data && a.data.startsWith("data:")) {
              try {
                const b = d2b(a.data),
                  r = await AS.upload(b, { contentType: b.type });
                a.data = r.url;
                a.aid = r.id;
              } catch (e) {}
            }
          }
          migrate(p);
          migrate2(p);
          migrate3(p);
          p.params = p.params || [];
          p.id = Date.now() + n++;
          P.push(p);
        }
        log("Imported projects from this browser");
        save();
        draw();
        toast("Imported " + n + " project(s).");
      }
      V.admin = () =>
        `<div class='card'><div class='ct'>Sharing and access</div><p class='sub'>${DB ? "Data and files are shared live with everyone who has this page. Roles follow Claude access: owners are Super Admins, editors are Admins and contributors are Users. View-only people can read but cannot change anything." : "Shared mode is not available in this view, so data is stored only in this browser."}</p></div>${DB && can("admin", "superadmin") ? `<div class='card'><div class='ct'>Import from this browser</div><p class='sub'>Copies projects that were saved in this browser before sharing was switched on into the shared data. Do this once.</p><button class='btn btg' onclick='impLoc()'>Import projects from this browser</button></div>` : ""}<div class='card'><div class='ct'>Backup</div><textarea id='bk' placeholder='Paste a backup here to import it'></textarea><div class='grow' style='margin-top:8px'><button class='btn btp' onclick='exp()'>Export to text</button><button class='btn btg' onclick='imp()'>Import from text</button></div></div><div class='card'><div class='ct'>Activity log</div><div class='sc'><table class='tbl'><tr><th>Time</th><th>User</th><th>Action</th></tr>${
          L.slice(-100)
            .reverse()
            .map(
              (x) =>
                `<tr><td>${new Date(x.ts).toLocaleString("en-GB")}</td><td>${esc(x.u)}</td><td>${esc(x.a)}</td></tr>`,
            )
            .join("") ||
          `<tr><td colspan=3 class='empty'>No activity yet.</td></tr>`
        }</table></div></div>`;
      function draw() {
        if (!$("pr")) {
          const d = document.createElement("div");
          d.id = "pr";
          document.body.append(d);
        }
        $("pr").innerHTML = "";
        const p = cp();
        $("sel").innerHTML = P.length
          ? P.map(
              (x) =>
                `<option value=${x.id} ${x.id === cur ? "selected" : ""}>${esc(x.name)}</option>`,
            ).join("")
          : "<option>No projects</option>";
        $("tabs").innerHTML = TABS.filter(
          (t) => t !== "admin" || can("admin", "superadmin"),
        )
          .map(
            (t) =>
              `<button class="tab ${t === tab ? "active" : ""}" onclick="go('${t}')">${TL[t]}</button>`,
          )
          .join("");
        $("gate").innerHTML = p
          ? `<div class="rail">${ST.map((s, i) => `<span class="${i === p.stage ? "cur" : i < p.stage ? "done" : ""}">${s}</span>`).join("")}</div>${p.stage < ST.length - 1 ? `<div class="grow"><button class="btn btp a" onclick="adv()">Pass gate and move to ${ST[p.stage + 1]}</button></div>` : ""}${BL.length ? `<ul class="err">${BL.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}`
          : "";
        $("view").innerHTML = V[tab](p);
        $("meta").textContent = p
          ? `${p.client} · ${p.type} · value ${fmt(p.contract)} · ${prog(p)}% complete`
          : "No project selected";
      }
      async function login() {
        const u = v("lu"),
          pw = $("lp").value,
          x = U.find((a) => a.username.toLowerCase() === u.toLowerCase());
        if (!x || x.pw !== (await hash(pw))) {
          $("lerr").textContent = "Invalid username or password.";
          $("lerr").classList.remove("hide");
          return;
        }
        me = x;
        try {
          localStorage.setItem("pm:s", x.id);
        } catch {}
        log("Signed in");
        save();
        enter();
      }
      function enter() {
        $("login").classList.add("hide");
        $("app").classList.remove("hide");
        document.body.dataset.role = me.role;
        $("ub").textContent = `${me.name} · ${RL[me.role]}`;
        draw();
      }
      function logout() {
        if (DB)
          return toast("You are signed in through Claude as " + me.name + ".");
        if (!confirm("Log out of " + me.name + "?")) return;
        try {
          localStorage.removeItem("pm:s");
        } catch {}
        location.reload();
      }
      (async () => {
        P = ld("pm:p", []);
        U = ld("pm:u", []);
        L = ld("pm:l", []);
        P.forEach(migrate);
        P.forEach(migrate2);
        P.forEach(migrate3);
        P.forEach((p) => {
          p.params = p.params || [];
          if (!TY.includes(p.type)) TY.push(p.type);
        });
        cur = P.length ? P[0].id : 0;
        if (!U.length) {
          U.push({
            id: 1,
            name: "Super Admin",
            username: "admin",
            role: "superadmin",
            pw: await hash("admin123"),
          });
          save();
        }
        if (U.length === 1 && U[0].username === "admin")
          $("lh").textContent =
            "First time? Sign in as admin / admin123, then change it on the Admin tab by adding your own Super Admin and deleting this one.";
        const s = ld("pm:s", 0),
          x = U.find((a) => a.id === s);
        if (x) {
          me = x;
          enter();
        }
        await boot();
      })();
    </script>
